[build-system]
requires = ["uv_build==0.12.16"]
build-backend = "uv_build"

[project]
name = "bg-dvorak-phonetic"
version = "0.1.0"
description = "Recoverable Bulgarian Dvorak phonetic keyboard layout installation"
requires-python = ">=3.14.7,<3.15"
dependencies = []

[project.scripts]
bg-dvorak-phonetic = "bg_dvorak_phonetic.cli:main"

[dependency-groups]
dev = ["pytest", "coverage", "ruff", "mypy", "uv_build==0.12.16"]

[tool.uv]
required-version = "==0.12.16"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/bg_dvorak_phonetic"]
relative_files = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
